name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Backend: lint + test ────────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install dev/test dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          flake8 app/ \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E203 \
            --exclude=__pycache__,.venv,alembic

      - name: Run tests
        env:
          DATABASE_URL: "sqlite://"
          SECRET_KEY: "ci-test-secret-key-that-is-long-enough-32ch"
          REDIS_HOST: "localhost"
          DEBUG: "True"
          DEFAULT_ADMIN_PASSWORD: "ci-admin-password"
        run: python -m pytest tests/ -v --tb=short

  # ── Frontend: build + test ──────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: "https://shrinkr-w57o.onrender.com"
        run: npm run build

  # ── Docker build verification ───────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend]  # Only verify Docker build if backend tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build ./backend --tag shrinkr-backend:ci

      - name: Smoke-test backend image healthcheck presence
        run: docker inspect shrinkr-backend:ci --format='{{json .Config.Healthcheck}}'
